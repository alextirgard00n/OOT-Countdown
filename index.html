<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OoT Countdown</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="media/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="media/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="media/apple-touch-icon.png" />
    <link rel="preload" as="image" href="media/keyart.jpg">

    <!-- HTML Meta Tags -->
    <meta name="description" content="Ocarina of Time Countdown">

    <!-- Facebook Meta Tags -->
    <meta property="og:url" content="https://alextirgard00n.github.io/oot-countdown/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="OoT Countdown">
    <meta property="og:description" content="Ocarina of Time Countdown">
    <meta property="og:image" content="https://alextirgard00n.github.io/oot-countdown/media/og-img.jpg">

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta property="twitter:domain" content="alextirgard00n.github.io">
    <meta property="twitter:url" content="https://alextirgard00n.github.io/oot-countdown/">
    <meta name="twitter:title" content="OoT Countdown">
    <meta name="twitter:description" content="Ocarina of Time Countdown">
    <meta name="twitter:image" content="https://alextirgard00n.github.io/oot-countdown/media/og-img.jpg">
</head>

<body>
    <div class="backdrop" aria-hidden="true"></div>

    <img src="./media/z40-badge.png" alt="Zelda 40th anniversary" class="badge">

    <main class="panel-column">
        <img src="./media/oot-logo.png" alt="The Legend of Zelda: Ocarina of Time" class="oot-logo">

        <section class="panel">
            <div class="countdown-container">
                <div class="countdown">
                    <div class="numbers days">--</div>
                    <div class="countdown-info">Days</div>
                </div>
                <div class="countdown">
                    <div class="numbers hours">--</div>
                    <div class="countdown-info">Hours</div>
                </div>
                <div class="countdown">
                    <div class="numbers mins">--</div>
                    <div class="countdown-info">Mins</div>
                </div>
                <div class="countdown">
                    <div class="numbers seconds">--</div>
                    <div class="countdown-info">Seconds</div>
                </div>
            </div>

            <div class="countdown-text">
                <p class="headline">Countdown Until Release</p>
                <p class="date">November 5th, 2026</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
